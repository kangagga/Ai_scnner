<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CryptoBot">
<meta name="theme-color" content="#00ffe7">
<link rel="manifest" href="/manifest.json">
<title>AI Crypto Signal Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a0f;--accent:#00ffe7;--accent2:#00a8ff;--buy:#00ff88;--sell:#ff3366;--warn:#ffaa00;--text:#c8e6f5;--dim:#4a7a9b;--card:rgba(0,255,231,0.04);--border:rgba(0,255,231,0.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,231,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,231,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;border:2px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 12px rgba(0,255,231,0.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(0,255,231,0.3)}50%{box-shadow:0 0 24px rgba(0,255,231,0.6)}}
.logo-text{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:2px}
.logo-sub{font-size:11px;color:var(--dim);letter-spacing:3px;font-family:'Share Tech Mono',monospace}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--buy);box-shadow:0 0 8px var(--buy);animation:blink 1.5s ease-in-out infinite;margin-right:6px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.status-text{font-size:12px;color:var(--buy);font-family:'Share Tech Mono',monospace}
.last-update{font-size:11px;color:var(--dim);margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent2),transparent)}
.stat-label{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:var(--accent);font-family:'Share Tech Mono',monospace;line-height:1}
.stat-value.buy{color:var(--buy)}.stat-value.sell{color:var(--sell)}.stat-value.warn{color:var(--warn)}
.progress-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.progress-header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--dim)}
.progress-bar-bg{background:rgba(0,255,231,0.08);border-radius:4px;height:6px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;transition:width 0.5s ease;box-shadow:0 0 8px var(--accent);width:0%}
.main-grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:800px){.main-grid{grid-template-columns:1fr}}
.signals-panel,.log-panel,.config-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(0,255,231,0.03)}
.panel-title{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.signal-count{font-size:11px;background:rgba(0,255,231,0.1);border:1px solid rgba(0,255,231,0.2);color:var(--accent);padding:2px 8px;border-radius:20px;font-family:'Share Tech Mono',monospace}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 12px;font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(0,255,231,0.05);transition:background 0.2s}
tbody tr:hover{background:rgba(0,255,231,0.04)}
tbody td{padding:10px 12px;font-size:13px;white-space:nowrap}
.sym{font-weight:700;color:#fff;font-family:'Share Tech Mono',monospace;font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px}
.badge.BUY{background:rgba(0,255,136,0.12);color:var(--buy);border:1px solid rgba(0,255,136,0.3)}
.badge.SELL{background:rgba(255,51,102,0.12);color:var(--sell);border:1px solid rgba(255,51,102,0.3)}
.wr{font-family:'Share Tech Mono',monospace}.wr.high{color:var(--buy)}.wr.mid{color:var(--warn)}.wr.low{color:var(--sell)}
.score-bar-bg{background:rgba(255,255,255,0.06);border-radius:3px;height:5px;overflow:hidden;width:70px}
.score-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.empty-state{padding:48px;text-align:center;color:var(--dim)}
.sidebar{display:flex;flex-direction:column;gap:16px}
.log-list{max-height:280px;overflow-y:auto}
.log-item{padding:8px 14px;border-bottom:1px solid rgba(0,255,231,0.04);display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:12px}
.log-time{color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:10px;white-space:nowrap}
.config-item{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid rgba(0,255,231,0.04);font-size:12px}
.config-key{color:var(--dim);letter-spacing:1px}.config-val{color:var(--accent);font-family:'Share Tech Mono',monospace;font-weight:600}
.refresh-btn{background:transparent;border:1px solid var(--border);color:var(--dim);padding:4px 12px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:1px}
</style>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").then(()=>console.log("PWA ready")).catch(e=>console.log("SW error",e))}</script>
</head>
<body>
<div class="container">
<header>
  <div class="logo">
    <div class="logo-icon">📡</div>
    <div><div class="logo-text">CRYPTO SIGNAL</div><div class="logo-sub">AI SCANNER v3</div></div>
  </div>
  <div style="text-align:right">
    <div><span class="status-dot"></span><span class="status-text" id="statusText">ONLINE</span></div>
    <div class="last-update" id="lastUpdate">—</div>
  </div>
</header>
<div class="stats-row">
  <div class="stat-card"><div class="stat-label">Total Sinyal</div><div class="stat-value" id="statTotal">0</div></div>
  <div class="stat-card"><div class="stat-label">BUY</div><div class="stat-value buy" id="statBuy">0</div></div>
  <div class="stat-card"><div class="stat-label">SELL</div><div class="stat-value sell" id="statSell">0</div></div>
  <div class="stat-card"><div class="stat-label">Avg Win Rate</div><div class="stat-value warn" id="statWr">0%</div></div>
  <div class="stat-card"><div class="stat-label">Avg Score</div><div class="stat-value" id="statScore">0</div></div>
</div>
<div class="progress-wrap">
  <div class="progress-header"><span>🔍 SCAN PROGRESS</span><span id="progressLabel">—</span></div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
</div>
<div class="main-grid">
  <div class="signals-panel">
    <div class="panel-header">
      <span class="panel-title">🎯 Live Signals</span>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="signal-count" id="signalCount">0 sinyal</span>
        <button class="refresh-btn" onclick="fetchAll()">↻ Refresh</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Symbol</th><th>Signal</th><th>TF</th><th>Win Rate</th><th>Score</th><th>Price</th></tr></thead>
        <tbody id="signalBody"><tr><td colspan="6"><div class="empty-state"><div style="font-size:36px;margin-bottom:12px">📡</div><p>Menunggu data sinyal...</p></div></td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="sidebar">
    <div class="log-panel">
      <div class="panel-header"><span class="panel-title">📋 Activity Log</span></div>
      <div class="log-list" id="logList">
        <div class="log-item"><span>⏳</span><span>Menunggu bot...</span><span class="log-time">—</span></div>
      </div>
    </div>
    <div class="config-panel">
      <div class="panel-header"><span class="panel-title">⚙️ Config</span></div>
      <div id="configList"><div class="config-item"><span class="config-key">Loading...</span></div></div>
    </div>
  </div>
</div>
</div>
<script>
async function fetchStatus(){
  try{
    const d=await(await fetch('/api/status')).json();
    document.getElementById('lastUpdate').textContent=d.last_scan?'Last scan: '+d.last_scan:'—';
    const s=d.stats||{};
    document.getElementById('statTotal').textContent=s.total||0;
    document.getElementById('statBuy').textContent=s.buy||0;
    document.getElementById('statSell').textContent=s.sell||0;
    document.getElementById('statWr').textContent=(s.avg_wr||0)+'%';
    document.getElementById('statScore').textContent=s.avg_score||0;
    const p=d.scan_progress||{};
    document.getElementById('progressBar').style.width=(p.pct||0)+'%';
    document.getElementById('progressLabel').textContent=p.total?p.done+'/'+p.total+' — '+(p.current||''):'—';
    const logs=d.logs||[];
    if(logs.length)document.getElementById('logList').innerHTML=logs.map(l=>'<div class="log-item"><span>'+l.icon+'</span><span>'+l.message+'</span><span class="log-time">'+l.time+'</span></div>').join('');
    const cfg=d.config||{};
    const keys=Object.keys(cfg);
    if(keys.length)document.getElementById('configList').innerHTML=keys.map(k=>'<div class="config-item"><span class="config-key">'+k+'</span><span class="config-val">'+cfg[k]+'</span></div>').join('');
  }catch(e){
    document.getElementById('statusText').textContent='OFFLINE';
    document.querySelector('.status-dot').style.background='#ff3366';
  }
}
async function fetchSignals(){
  try{
    const signals=await(await fetch('/api/signals')).json();
    document.getElementById('signalCount').textContent=signals.length+' sinyal';
    if(!signals.length){document.getElementById('signalBody').innerHTML='<tr><td colspan="6"><div class="empty-state"><div style="font-size:36px">📭</div><p>Belum ada sinyal</p></div></td></tr>';return;}
    document.getElementById('signalBody').innerHTML=signals.map((s,i)=>{
      const type=( s.signal||'').includes('BUY')?'BUY':'SELL';
      const wr=s.win_rate||s.predicted_wr||0;
      const sc=s.score||s.confidence||0;
      const wrClass=wr>=70?'high':wr>=55?'mid':'low';
      const price=s.price?parseFloat(s.price).toPrecision(5):'—';
      return '<tr><td class="sym">'+(s.symbol||'—')+'</td><td><span class="badge '+type+'">'+type+'</span></td><td style="color:var(--dim)">'+( s.timeframe||'—')+'</td><td class="wr '+wrClass+'">'+wr+'%</td><td><div style="font-size:11px;color:var(--accent)">'+sc+'</div><div class="score-bar-bg"><div class="score-bar-fill" style="width:'+sc+'%"></div></div></td><td style="font-family:monospace;font-size:12px">'+price+'</td></tr>';
    }).join('');
  }catch(e){console.warn(e);}
}
async function fetchAll(){await Promise.all([fetchStatus(),fetchSignals()]);}
fetchAll();setInterval(fetchAll,15000);
</script>
</body>
</html>
